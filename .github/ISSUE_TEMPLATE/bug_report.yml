name: Bug report
description: Something in this repository is wrong or broken.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not report security vulnerabilities here.** Follow the private process in [SECURITY.md](https://github.com/authlume/authlume/blob/main/SECURITY.md).

        Authlume is pre-release and has no published packages yet. Never include secrets, credentials, tokens or real user data in an issue.
  - type: checkboxes
    id: preflight
    attributes:
      label: Before you submit
      options:
        - label: This is not a security vulnerability.
          required: true
        - label: I searched existing issues and this has not been reported.
          required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Planning documents or documentation
        - Repository configuration or templates
        - A package (once packages exist)
        - Other
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the problem.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Minimal steps, links or code. Remove any secrets or personal data first.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The package version or commit SHA where you saw the problem.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Node.js, operating system, framework and database versions, if relevant.
